      # =====================================================
      # HTTP 5XX ERRORS
      # =====================================================
      - uid: http-5xx-errors
        title: Erros HTTP 5xx
        condition: C

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              expr: |
                sum(
                  count_over_time(
                    {job="nginx",service="portfolio",log_type="access"}
                    | pattern `<client_ip> - <user> [<_>] "<http_method> <request_uri> <protocol>" <http_status> <bytes> "<referer>" "<agent>"`
                    | http_status=~"5.."
                    [5m]
                  )
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
                  type: query
              refId: C
              type: threshold

        for: 2m
        noDataState: OK
        execErrState: Error

        annotations:
          summary: Erros HTTP 5xx detectados
          description: Foram detectadas múltiplas respostas HTTP 5xx no Portfolio nos últimos 5 minutos.

        labels:
          severity: critical
          environment: production
          team: sre

