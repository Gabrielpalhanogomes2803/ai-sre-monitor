apiVersion: 1

groups:
  - orgId: 1
    name: noc-core-alerts
    folder: Infrastructure
    interval: 1m

    rules:

      # =====================================================
      # PORTFOLIO DOWN
      # =====================================================
      - uid: portfolio-down
        title: Portfolio Fora do Ar
        condition: C

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: probe_success{job="portfolio"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
                  type: query
              refId: C
              type: threshold

        for: 2m
        noDataState: Alerting
        execErrState: Error

        annotations:
          summary: Portfolio indisponível
          description: O monitoramento externo não conseguiu acessar gabrielgomes.cloud.

        labels:
          severity: critical
          environment: production
          team: sre


      # =====================================================
      # HIGH CPU
      # =====================================================
      - uid: high-cpu
        title: CPU Alta
        condition: C

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
                  type: query
              refId: C
              type: threshold

        for: 10m
        noDataState: NoData
        execErrState: Error

        annotations:
          summary: Uso de CPU elevado
          description: O uso de CPU permaneceu acima de 85% por 10 minutos.

        labels:
          severity: warning
          environment: production
          team: sre


